<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Manual Interativo — Provérbios para a Vida</title>
<style>
:root{--font:1;--primary:#193c30;--gold:#ba8d35;--bg:#f4f3ef;--ink:#26362f;--line:#d8e0d9;--white:#fff}*{box-sizing:border-box}body{margin:0;font:calc(16px * var(--font))/1.68 system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--bg);color:var(--ink)}button,a{font:inherit}button{cursor:pointer}button:focus-visible,a:focus-visible,summary:focus-visible{outline:3px solid var(--gold);outline-offset:2px}.top{position:sticky;top:0;z-index:20;background:var(--primary);color:white;display:flex;align-items:center;gap:9px;flex-wrap:wrap;padding:12px}.brand{font-weight:750;flex:1;min-width:160px}.top button{background:#ffffff1a;color:white;border:1px solid #ffffff60;border-radius:9px;padding:7px 11px}.shell{display:grid;grid-template-columns:250px minmax(0,1fr)}aside{position:sticky;top:58px;align-self:start;height:calc(100dvh - 58px);overflow:auto;background:#fff;border-right:1px solid var(--line);padding:18px}aside a{display:block;text-decoration:none;color:var(--ink);padding:9px;border-radius:7px}aside a:hover{background:#e8eee9}main{width:100%;max-width:1050px;padding:22px 24px 70px;margin:auto;min-width:0}.hero{background:var(--primary);color:white;border-radius:16px;padding:25px;margin-bottom:18px}.hero h1{font-size:1.6em;line-height:1.2;margin:0}.hero p{margin:.4em 0 0}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:15px 0}.tabs button,.navbuttons button{background:#fff;border:1px solid #a3b8a8;color:var(--primary);font-weight:650;padding:9px 15px;border-radius:9px}.tabs button[aria-selected=true]{background:var(--primary);color:white}.panel[hidden],.step[hidden]{display:none!important}.section,.roteiro-section,.summary-block,.callout,.example,.essencial-box,.bible-text,.prayer-box,.dynamic-box,.meta-card,.illustration-box,.tip-box,.script-box,.challenge-box,.engage-box,.memorize-box,.prayer-final{background:white;color:var(--ink);border:1px solid var(--line);border-radius:12px;padding:15px;margin:14px 0;max-width:100%}.section-title,.roteiro-section-title{font-size:1.18em;font-weight:750;color:var(--primary)}.section-label,.meta-label,.example-title,.callout-title,.script-label{font-weight:750;color:#80601e}.lesson-content,.roteiro-content,.summary-page{max-width:100%;overflow-wrap:break-word}.summary-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,260px),1fr));gap:12px}.summary-block{margin:0}.summary-full{grid-column:1/-1}details{border:1px solid var(--line);border-radius:12px;background:white;padding:6px 14px;margin:10px 0}details summary{font-weight:750;color:var(--primary);padding:8px;cursor:pointer}.section{border:0;padding:5px 8px}.bible-quote{font-style:italic}.navbuttons{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:12px 0}.navbuttons button:disabled{opacity:.35;cursor:not-allowed}.roteiro-section.step{border:0}.notes-lines div{height:24px;border-bottom:1px solid var(--line)}.opt{color:#5c6b62;font-size:.87em}.menu{display:none}.veil{display:none}table{border-collapse:collapse;max-width:100%}td,th{padding:6px;border-bottom:1px solid var(--line)}@media(max-width:790px){.menu{display:block}aside{position:fixed;top:0;left:0;height:100dvh;width:min(320px,82vw);z-index:40;transform:translateX(-110%);transition:transform .2s;box-shadow:5px 0 30px #0002}aside.open{transform:none}.veil.open{display:block;position:fixed;inset:0;background:#0008;z-index:30}.shell{display:block}main{padding:16px 14px 65px}.hero{padding:19px}.top .brand{width:100%;order:-1}.hero h1{font-size:1.37em}}@media print{.top,aside,.veil,.tabs,.navbuttons{display:none!important}.shell{display:block}main{max-width:none;padding:0}.step[hidden]{display:block!important}}
</style></head><body>
<header class="top"><button class="menu" id="menu" aria-controls="sidebar" aria-expanded="false">☰ Índice</button><span class="brand">Provérbios para a Vida</span><button id="smaller" aria-label="Diminuir fonte">A−</button><button id="normal" aria-label="Tamanho padrão">A</button><button id="larger" aria-label="Aumentar fonte">A+</button><button id="fullscreen" aria-label="Tela cheia">⛶</button></header><div class="veil" id="veil"></div>
<div class="shell"><aside id="sidebar" aria-label="Índice"><h2>Índice</h2><nav id="nav"><a href="#inicio">Início</a><a href="#estudo" data-mode="estudo">Estudo</a><a href="#aula" data-mode="aula">Aula em slides</a><a href="#consulta" data-mode="consulta">Consulta</a><a href="#familia">Desafio da semana</a><a href="index.html">Todas as lições</a></nav></aside><main><header class="hero" id="inicio"><h1 id="title">Carregando a lição…</h1><p id="subtitle"></p></header><div class="tabs" role="tablist" aria-label="Modo de leitura"><button role="tab" data-target="estudo" aria-controls="estudo" aria-selected="true">Estudo</button><button role="tab" data-target="aula" aria-controls="aula" aria-selected="false">Aula · Slides</button><button role="tab" data-target="consulta" aria-controls="consulta" aria-selected="false">Consulta</button></div><p id="status" role="status" aria-live="polite"></p><section id="estudo" class="panel" role="tabpanel" aria-label="Estudo"></section><section id="aula" class="panel" role="tabpanel" aria-label="Aula" hidden><div class="navbuttons"><button id="prev">← Anterior</button><span id="position" aria-live="polite"></span><button id="next">Próximo →</button></div><div id="steps"></div><div class="navbuttons"><button id="prev2">← Anterior</button><button id="next2">Próximo →</button></div></section><section id="consulta" class="panel" role="tabpanel" aria-label="Consulta" hidden></section><section id="familia"><h2>Desafio da Semana</h2><p>Uma atividade prática e somente o versículo principal para memorizar.</p><a id="challenge" href="#">Abrir material para a família</a></section></main></div>
<script>
(()=>{'use strict';
const $=q=>document.querySelector(q),$$=q=>[...document.querySelectorAll(q)];
const n=Number(new URLSearchParams(location.search).get('licao'));if(!Number.isInteger(n)||n<1||n>31){$('#title').textContent='Escolha uma lição';$('#status').textContent='Use o índice de todas as lições.';return}
const nn=String(n).padStart(2,'0');const urls=['../guia-professor/leitura/Licao_'+nn+'.html','../roteiro-aula/leitura/Licao_'+nn+'.html','../resumo-rapido/leitura/Licao_'+nn+'.html'];$('#challenge').href='../desafio-semana/leitura/Licao_'+nn+'.html';
const menu=$('#menu'),side=$('#sidebar'),veil=$('#veil');function togg(open){side.classList.toggle('open',open);veil.classList.toggle('open',open);menu.setAttribute('aria-expanded',String(open))}menu.onclick=()=>togg(!side.classList.contains('open'));veil.onclick=()=>togg(false);$$('#nav a').forEach(a=>a.addEventListener('click',()=>togg(false)));
let font=1;try{font=Number(localStorage.getItem('pv-reader-size'))||1}catch(e){}function setFont(v){font=Math.max(.85,Math.min(1.7,v));document.documentElement.style.setProperty('--font',font);try{localStorage.setItem('pv-reader-size',String(font))}catch(e){}}setFont(font);$('#smaller').onclick=()=>setFont(font-.1);$('#larger').onclick=()=>setFont(font+.1);$('#normal').onclick=()=>setFont(1);$('#fullscreen').onclick=()=>document.fullscreenElement?document.exitFullscreen?.():document.documentElement.requestFullscreen?.();
const modes=$$('.tabs button');function mode(m){modes.forEach(b=>b.setAttribute('aria-selected',String(b.dataset.target===m)));$$('.panel').forEach(p=>p.hidden=p.id!==m);if(m==='aula')show(step);history.replaceState(null,'','#'+m)}modes.forEach(b=>b.onclick=()=>mode(b.dataset.target));$$('#nav [data-mode]').forEach(a=>a.addEventListener('click',e=>{e.preventDefault();mode(a.dataset.mode)}));
let steps=[],step=0;function show(v){step=Math.max(0,Math.min(steps.length-1,v));steps.forEach((el,i)=>el.hidden=i!==step);$('#position').textContent=steps.length?(step+1)+' / '+steps.length:'';for(const id of ['prev','prev2'])$('#'+id).disabled=step===0;for(const id of ['next','next2'])$('#'+id).disabled=step===steps.length-1}for(const id of ['prev','prev2'])$('#'+id).onclick=()=>show(step-1);for(const id of ['next','next2'])$('#'+id).onclick=()=>show(step+1);document.addEventListener('keydown',e=>{if(e.key==='Escape')togg(false);if($('#aula').hidden)return;if(e.key==='ArrowRight')show(step+1);if(e.key==='ArrowLeft')show(step-1)});
async function load(){try{const docs=await Promise.all(urls.map(async u=>{const r=await fetch(u);if(!r.ok)throw Error('Erro HTTP '+r.status+' em '+u);return new DOMParser().parseFromString(await r.text(),'text/html')}));const [g,r,s]=docs;let title=g.querySelector('.lesson-title')?.textContent||'Lição '+n;$('#title').textContent=title;$('#subtitle').textContent='Provérbios '+n+' · Lição '+n+' de 31';
const guide=g.querySelector('.lesson-content'),roteiro=r.querySelector('.roteiro-content'),summary=s.querySelector('.summary-page');if(!guide||!roteiro||!summary)throw Error('Estrutura do material não encontrada');
for(const section of guide.querySelectorAll('.section')){if(section.querySelector('.section-title')?.textContent.includes('Mundo x Deus'))section.remove();if(section.querySelector('.section-title')?.textContent.includes('Erros que o Professor Deve Evitar'))section.remove();}
const children=[...guide.children].filter(el=>el.classList.contains('section'));for(let i=0;i<children.length;i++){let el=children[i],dt=g.createElement('details'),su=g.createElement('summary');su.textContent=el.querySelector('.section-title')?.textContent||'Estudo bíblico';dt.open=i===0;el.replaceWith(dt);dt.append(su,el)}const deep=guide.querySelector('details.aprofunde');if(deep)deep.open=false;$('#estudo').append(...Array.from(guide.childNodes));
const sections=[...roteiro.querySelectorAll(':scope > .roteiro-section')];for(const el of sections){if(el.querySelector('.roteiro-section-title')?.textContent.includes('Mundo x Deus'))el.remove();else{el.classList.add('step');$('#steps').append(el)}}steps=$$('#steps > .step');show(0);
for(const e of summary.querySelectorAll('.summary-block'))if(e.querySelector('h4')?.textContent.includes('Erros a Evitar'))e.remove();$('#consulta').append(...Array.from(summary.childNodes));$('#status').textContent='';const hash=location.hash.slice(1);if(['estudo','aula','consulta'].includes(hash))mode(hash);
}catch(err){$('#title').textContent='Não foi possível carregar a lição';$('#status').textContent=err.message+' — verifique a publicação de todas as pastas HTML no mesmo domínio.'}}
load();
})();
</script></body></html>
